# Docker Hardened Images - Customization
# Example 2 of 2: Java (Temurin) FIPS + Python FIPS via hardened packages
#
# Approach
# --------
# Use the Temurin 21 / Debian 13 FIPS image as the BASE and add Python by
# installing the `python3` and `pip` packages from Docker's hardened system
# packages repository (same provenance + patching discipline as the base).
#
# Why this is the FIPS-safe approach: packages added this way are built for and
# installed onto THIS base, so the Python interpreter links against the base's
# FIPS-validated OpenSSL. There is no cross-image binary copy and no risk of
# dragging in a second, non-validated OpenSSL — the FIPS crypto chain is shared
# by both Java and Python.
#
# generated by: dhictl customization prepare temurin 21 \
#   --org demonstrationorg \
#   --destination demonstrationorg/dhi-temurin-python-fips-pkg \
#   --name pythonFipsPackages --output customization.yaml

name: pythonFipsPackages
# id: <assigned by dhictl after create — committed back by the Recreate workflow>

# --- Base image (the Java FIPS runtime) ---------------------------------------
# FLAT schema, for parity with the artifact example so both can be created with
# the same dhictl. This package-only example has no artifacts, so it ALSO works
# on the latest dhictl with the newer `targets:` array — but the flat form is
# universal (works on v0.0.2 through v0.0.5, with a deprecation warning on new
# versions).
#
# `destination` MUST be an EXISTING DHI mirror in your org (dhi-eclipse-temurin).
# `source` is the catalog slug eclipse-temurin (NOT temurin). `tag_definition_id`
# is the canonical definition ID (NOT a tag name), of the form
# <image>/<os-dir>/jre-<major>[-fips], from `dhictl customization prepare`.
source: dhi/eclipse-temurin
destination: demonstrationorg/dhi-eclipse-temurin
tag_definition_id: eclipse-temurin/debian-13/jre-21-fips

platforms:
  - linux/amd64
  - linux/arm64

# --- Add Python via hardened packages -----------------------------------------
contents:
  packages:
    # Package names come from the DHI hardened repo for the Debian 13 variant.
    # On Debian, pip is shipped by `python3-pip` (this provides the `pip3`
    # command). Verify the exact names available for this base with:
    #   dhictl customization prepare temurin 21 --org demonstrationorg
    # (the `packages:` field tab-completes the catalog for the chosen variant).
    - python3
    - python3-pip

# --- Environment --------------------------------------------------------------
environment:
  # python3 / pip3 land on the default system PATH when installed as packages,
  # so usually no PATH change is needed. JAVA_HOME / FIPS OpenSSL config are
  # inherited from the Temurin base unchanged.
  PYTHON_VERSION: "3.14"

accounts:
  runs-as: nonroot
  users:
    - name: nonroot
      uid: 65532
  groups:
    - name: nonroot
      gid: 65532

cmd:
  - java
  - -version
