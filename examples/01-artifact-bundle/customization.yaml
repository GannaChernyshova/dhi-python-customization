# Docker Hardened Images - Customization
# Example 1 of 2: Java (Temurin) FIPS + Python FIPS via OCI artifact bundling
#
# Approach
# --------
# Use the Temurin 21 / Debian 13 FIPS image as the BASE (so the Java FIPS crypto
# chain stays untouched), then layer the Python FIPS runtime on top by
# referencing the Python DHI image as an OCI *artifact* and copying only the
# Python runtime tree out of it.
#
# Why Temurin is the base (not Python): the base image's own java.security /
# FIPS provider config and its FIPS-validated OpenSSL must be preserved. Keeping
# Temurin as the base preserves the Java FIPS posture automatically; we only add
# files on top.
#
# generated by: dhictl customization prepare temurin 21 \
#   --org demonstrationorg \
#   --destination demonstrationorg/dhi-temurin-python-fips \
#   --name pythonFipsArtifact --output customization.yaml

name: pythonFipsArtifact
# id: assigned by dhictl on create. NOTE: ids are deterministic from name+
# destination, and the DHI build service caches the artifact "copy" layer per id.
# If you ever built this name with a BROKEN include (e.g. a bare dir path), that
# empty layer is cached and edits won't bust it — use a NEW name to force a clean
# build (see README "artifact include must be a recursive glob").

# --- Base image (the Java FIPS runtime) ---------------------------------------
# FLAT schema (source/destination/tag_definition_id). Required because the
# artifact feature is broken in dhictl >= v0.0.3 (it injects an invalid
# `__typename` into artifact inputs), so this example must be created with
# dhictl v0.0.2 — which predates the newer `targets:` array. The flat form also
# still works (with a deprecation warning) on newer dhictl, so it is universal.
#
# `destination` MUST be an EXISTING DHI mirror in your org. The customization
# writes new, suffixed tags onto that mirror (e.g.
# 21-debian13-fips_pythonFipsArtifact) — it does not create a new repo. Your
# Temurin base lives at demonstrationorg/dhi-eclipse-temurin:21-debian13-fips.
#
# `source` is the DHI catalog slug — for Temurin it is eclipse-temurin (NOT
# temurin). `tag_definition_id` is the canonical definition ID (NOT a tag name),
# of the form <image>/<os-dir>/jre-<major>[-fips], as produced by
# `dhictl customization prepare eclipse-temurin 21-debian13-fips --org demonstrationorg`.
source: dhi/eclipse-temurin
destination: demonstrationorg/dhi-eclipse-temurin
tag_definition_id: eclipse-temurin/debian-13/jre-21-fips

platforms:
  - linux/amd64
  - linux/arm64

# --- Add Python on top --------------------------------------------------------
contents:
  artifacts:
    # The Python FIPS image, referenced as an OCI artifact. It MUST live in the
    # same Docker Hub namespace (demonstrationorg) as this customization.
    #
    # python3 AND pip3 BOTH come from THIS image. IMPORTANT: in the DHI Python
    # image, /opt/python is a SYMLINK -> /opt/python-3.14.6, and the real runtime
    # tree (bin/python3, bin/pip3, lib/, stdlib, site-packages) lives in the
    # VERSIONED directory. Including only `opt/python` copies the symlink and
    # leaves it DANGLING — the result image then has no python at all. You must
    # include BOTH the symlink and its target directory.
    - name: demonstrationorg/dhi-python-ann:3.14-debian13-fips
      # `includes` is an ALLOW-LIST and MUST use a recursive glob (`/**`): a bare
      # directory path (e.g. `opt/python`) copies the dir entry only and recurses
      # NOTHING — verified empirically, the result image ends up with no python.
      # `opt/**` copies the whole /opt tree from the Python image: the
      # /opt/python symlink, the real /opt/python-3.14.x/ runtime, and /opt/docker
      # (the latter just overwrites the base's static SBOM dir — harmless, the
      # build regenerates the real SBOM attestation). Using `opt/**` also avoids
      # hard-coding the Python patch version in the path.
      includes:
        - opt/**
      # NOTE: no `excludes` here. `includes` is an allow-list, so listing only
      # `opt/python` already guarantees nothing else (e.g. etc/passwd, the base
      # OpenSSL/FIPS config) is copied — excludes would be redundant. They are
      # also omitted because dhictl (v0.0.5) mis-serializes an artifact that
      # carries `excludes`, injecting an invalid `__typename` field into the
      # create mutation. If you ever DO need excludes (only when you widen
      # `includes` beyond opt/python), the paths to keep from the Temurin base
      # are: etc/passwd, etc/group, etc/shadow, etc/os-release,
      # etc/ssl/openssl.cnf, etc/ssl/fipsmodule.cnf.

  # The Python interpreter+pip come from the artifact above, but Python's C
  # extension modules dynamically link against system shared libraries that the
  # Temurin JRE base does NOT ship (it has only base-files, ca-certificates,
  # libstdc++6, locales). Without these, the copied python3 would fail to import
  # the matching stdlib modules. Pulled from the same hardened Debian 13 (trixie)
  # repo the DHI Python image uses, so they are ABI-matched to the interpreter.
  #
  # MINIMAL set — covers pip + the most common imports. If your app needs more,
  # add the relevant lib back (the DHI Python image's full dependency set also
  # includes: libbz2-1.0 [bz2], liblzma5 [lzma], libreadline8t64 + libncursesw6
  # + ncurses-base/bin [readline/curses], libcrypt1 [crypt], libdb5.3t64 [dbm],
  # tzdata [zoneinfo]).
  packages:
    - zlib1g           # zlib — required by pip (unpacking wheels), gzip, zipimport
    - libffi8          # ctypes (pulled in by many third-party packages)
    - libsqlite3-0     # sqlite3
    - libuuid1         # uuid
    - netbase          # socket service/protocol name lookups

# --- Make java + python3 + pip3 resolvable ------------------------------------
environment:
  # Java binaries are symlinked into /usr/local/bin by the Temurin base (already
  # on the default PATH), so we only need to prepend Python's bin dir.
  PATH: "/opt/python/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  LD_LIBRARY_PATH: /opt/python/lib
  PYTHON_VERSION: "3.14"
  # JAVA_HOME (/opt/java/openjdk/21-jre) is set by the Temurin base; don't override.

accounts:
  runs-as: nonroot
  users:
    - name: nonroot
      uid: 65532
  groups:
    - name: nonroot
      gid: 65532

# Default to the Java entrypoint; override per workload (e.g. python3 app.py).
cmd:
  - java
  - -version
