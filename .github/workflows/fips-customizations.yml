name: DHI FIPS Customizations (Java + Python)

# Automates the two Java FIPS + Python FIPS customizations under examples/ via
# examples/customize.sh. Pins dhictl v0.0.2 because the artifact-bundle example
# uses contents.artifacts, which v0.0.3+ corrupts with an invalid __typename.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "create | edit | recreate"
        type: choice
        default: recreate
        options: [create, edit, recreate]
      target:
        description: "artifact | packages | all"
        type: choice
        default: all
        options: [artifact, packages, all]
  push:
    branches: [main]
    paths:
      - examples/01-artifact-bundle/customization.yaml
      - examples/02-packages/customization.yaml
      - examples/customize.sh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  customize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Authenticate with Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run customization script
        # On push events there are no inputs, so default to edit/all.
        run: |
          chmod +x examples/customize.sh
          examples/customize.sh "${ACTION:-edit}" "${TARGET:-all}"
        env:
          DHI_ORG: demonstrationorg
          DOCKER_PAT: ${{ secrets.DOCKERHUB_TOKEN }}
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
