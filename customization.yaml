name: zscaler
id: cz_192zwowno18lq
# tags: 3_python with curl and zscaler, 3-debian13_python with curl and zscaler, 3.14_python with curl and zscaler, 3.14-debian13_python with curl and zscaler, 3.14.3_python with curl and zscaler, 3.14.3-debian13_python with curl and zscaler

# --- Versions (update via GHA workflow_dispatch or edit directly) ---
# busybox_version: 1.37.0-alpine3.23
# zscaler_cert_tag: latest
# --------------------------------------------------------------------

source: dhi/python
tag_definition_id: python/alpine-3.23/3.14

destination: docker.io/demonstrationorg/dhi-python

platforms:
  - linux/amd64
  - linux/arm64

# Optional: additional packages and artifacts
contents:
  packages:
    - curl
  artifacts:
    - name: demonstrationorg/dhi-busybox:1-alpine3.23
      includes:
        - bin
    - name: demonstrationorg/zscaler-cert:latest
      includes:                                                                                                                                              
          - etc/ssl/certs/ca-certificates.crt  

accounts:
  runs-as: nonroot
  users:
    - name: nonroot
      uid: 65532
  groups:
    - name: nonroot
      gid: 65532

environment:
  LD_LIBRARY_PATH: /opt/python/lib
  PATH: "/opt/python/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  PYTHON_VERSION: 3.14
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

# Optional: custom files
